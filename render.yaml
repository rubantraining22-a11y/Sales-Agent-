services:
  # 1. ChromaDB Service (Docker Web Service)
  - type: web
    name: sales-agent-chroma
    runtime: docker
    dockerfilePath: Dockerfile.chroma
    plan: free
    envVars:
      - key: IS_PERSISTENT
        value: "TRUE"
      - key: ALLOW_RESET
        value: "TRUE"
      - key: ANONYMIZED_TELEMETRY
        value: "FALSE"

  # 2. Sales Agent Full-stack Web Service (Backend + Frontend)
  - type: web
    name: sales-agent-app
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: CHROMA_URL
        value: http://sales-agent-chroma:8000
      - key: EMBEDDING_MODEL
        value: Xenova/all-MiniLM-L6-v2
      - key: ONNXRUNTIME_NODE_INSTALL_CUDA
        value: "skip"
